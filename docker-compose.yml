services:
  postgres:
    image: postgres:17
    container_name: tenantflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenantflow
      POSTGRES_USER: tenantflow
      POSTGRES_PASSWORD: tenantflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./services/tenantflow-backend
      dockerfile: Dockerfile
    container_name: tenantflow-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tenantflow
      - SPRING_DATASOURCE_USERNAME=tenantflow
      - SPRING_DATASOURCE_PASSWORD=tenantflow
      - TENANTFLOW_JWT_SECRET=super-secret-production-jwt-key-change-me-in-production
      - TENANTFLOW_JWT_EXPIRATION_SECONDS=86400
      # Origins allowed to call the API directly from a browser (bypassing the nginx
      # proxy below). Not needed for the frontend service itself, which talks to the
      # backend same-origin via nginx, but kept configurable for direct API access.
      - TENANTFLOW_CORS_ALLOWED_ORIGINS=http://localhost:3000
      - TENANTFLOW_REFRESH_TOKEN_EXPIRATION_DAYS=30
      - TENANTFLOW_PASSWORD_RESET_EXPIRATION_MINUTES=30
      - TENANTFLOW_PASSWORD_RESET_URL=http://localhost:3000/reset-password?token={token}
      # false because this bundled stack is served over plain HTTP on localhost - a
      # Secure cookie would never be sent back by the browser. Any real deployment
      # behind HTTPS must set this to true (the default when the env var is unset).
      - TENANTFLOW_COOKIE_SECURE=false
      - TENANTFLOW_COOKIE_SAME_SITE=Lax
      - TENANTFLOW_OAUTH_FRONTEND_REDIRECT_URI=http://localhost:3000/oauth-callback
      # Optional: set these on the host (or in a .env file next to this compose file)
      # to enable "Continue with Google". Left blank, Google OAuth stays disabled.
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Leave VITE_API_URL unset to use same-origin relative requests, proxied to the
      # backend container by nginx.conf. Only set this to point the built frontend at
      # a different/remote backend host.
      args:
        VITE_API_URL: ""
    container_name: tenantflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data: