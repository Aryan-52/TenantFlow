server {
    listen 80;
    server_name localhost;

    # Reverse-proxy API calls to the backend service on the internal Docker network.
    # This lets the frontend call same-origin relative URLs (see src/api/client.ts),
    # so the built JS never has to bake in a specific backend hostname or port.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google OAuth entry point and callback (Spring Security's default paths). Same
    # same-origin rationale as /api/ above - also means Google's "Authorized redirect
    # URI" only ever needs to reference this frontend origin, never the backend's.
    location /oauth2/ {
        proxy_pass http://backend:8080/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:8080/login/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite's build gives every JS/CSS file a content hash in its filename, so these can
    # be cached aggressively forever - a rebuild produces new filenames, never reuses one.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # index.html itself must NEVER be cached - it's the only thing that references
        # the current (hashed) asset filenames. A cached index.html is exactly how a
        # browser ends up running yesterday's build after the server was updated.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
