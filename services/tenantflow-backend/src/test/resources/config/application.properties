# Test-wide overrides (loaded from classpath:/config/, so the main application.properties
# still applies). Individual test classes override these where they test the real thing.
spring.cache.type=simple
tenantflow.rate-limit.enabled=false
tenantflow.rate-limit.store=memory
# No separate management server in mock-MVC tests.
management.server.port=
tenantflow.storage.type=memory
# The reminder job runs on a timer in the app; tests call it directly.
tenantflow.reminders.enabled=false
