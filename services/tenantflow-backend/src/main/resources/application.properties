spring.application.name=tenantflow-backend

# ==========================
# Database
# ==========================
spring.datasource.url=jdbc:postgresql://localhost:5432/tenantflow?options=-c%20TimeZone=Asia/Kolkata
spring.datasource.username=tenantflow
spring.datasource.password=tenantflow
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ==========================
# Server
# ==========================
# 8095 is the local-development port (the Vite dev server on 5173 calls it directly).
# The Docker image pins SERVER_PORT=8080, which nginx and docker-compose rely on.
server.port=${SERVER_PORT:8095}

# ==========================
# JWT
# ==========================
# Required, no default. The empty fallback makes a missing variable arrive as "" (reported
# clearly by JwtProperties) instead of as the literal text ${TENANTFLOW_JWT_SECRET}.
tenantflow.jwt.secret=${TENANTFLOW_JWT_SECRET:}
tenantflow.jwt.expiration-seconds=${TENANTFLOW_JWT_EXPIRATION_SECONDS:86400}

# ==========================
# CORS
# ==========================
# Comma-separated list of origins allowed to call the API from a browser.
tenantflow.cors.allowed-origins=${TENANTFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ==========================
# Refresh tokens ("Remember me")
# ==========================
tenantflow.refresh-token.expiration-days=${TENANTFLOW_REFRESH_TOKEN_EXPIRATION_DAYS:30}

# ==========================
# Password reset
# ==========================
tenantflow.password-reset.expiration-minutes=${TENANTFLOW_PASSWORD_RESET_EXPIRATION_MINUTES:30}
# {token} is substituted with the raw reset token. Must point at the frontend's
# /reset-password route.
tenantflow.password-reset.url-template=${TENANTFLOW_PASSWORD_RESET_URL:http://localhost:3000/reset-password?token={token}}
# Password reset links are credentials: never logged unless explicitly enabled for local
# development without an email provider. Must stay false in every shared environment.
tenantflow.email.log-reset-links=${TENANTFLOW_EMAIL_LOG_RESET_LINKS:false}

# ==========================
# Cookies (refresh-token cookie)
# ==========================
# MUST be true for any real (HTTPS) deployment. Only ever false for the bundled
# plain-HTTP local Docker Compose stack - see docker-compose.yml.
tenantflow.cookie.secure=${TENANTFLOW_COOKIE_SECURE:true}
tenantflow.cookie.same-site=${TENANTFLOW_COOKIE_SAME_SITE:Lax}

# ==========================
# Google OAuth (optional - leave both blank to disable "Continue with Google" entirely)
# ==========================
tenantflow.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
tenantflow.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
# Where the browser lands after a successful Google login; this frontend page then calls
# POST /api/auth/refresh to turn the cookie that was just set into an access token.
tenantflow.oauth.google.frontend-redirect-uri=${TENANTFLOW_OAUTH_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth-callback}
# The callback URL Google returns to. Leave unset to derive it from the request (local dev, or a
# backend on its own domain). Behind the Vercel proxy set it to the public frontend domain:
# https://<app>/login/oauth2/code/google (and register exactly that URL in Google Cloud).
tenantflow.oauth.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:}

# Trust X-Forwarded-* headers from the nginx reverse proxy - needed so Spring Security
# builds correct absolute URLs (e.g. the OAuth2 redirect_uri) when running behind it.
server.forward-headers-strategy=native

# ==========================
# Redis (rate limiting + tenant-scoped caching; PostgreSQL stays the source of truth)
# ==========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
# Short timeouts: when Redis is down, requests fall back (DB / in-memory limiter) quickly
# instead of hanging.
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.cache.type=${TENANTFLOW_CACHE_TYPE:redis}

# ==========================
# Rate limiting (requests per window; per client IP for auth endpoints, per user otherwise)
# ==========================
tenantflow.rate-limit.enabled=${TENANTFLOW_RATE_LIMIT_ENABLED:true}
# redis = shared across instances (falls back to per-instance memory if Redis is down)
tenantflow.rate-limit.store=${TENANTFLOW_RATE_LIMIT_STORE:redis}
tenantflow.rate-limit.rules.login.limit=10
tenantflow.rate-limit.rules.login.window=1m
tenantflow.rate-limit.rules.register.limit=5
tenantflow.rate-limit.rules.register.window=10m
tenantflow.rate-limit.rules.forgot-password.limit=5
tenantflow.rate-limit.rules.forgot-password.window=15m
tenantflow.rate-limit.rules.reset-password.limit=10
tenantflow.rate-limit.rules.reset-password.window=15m
tenantflow.rate-limit.rules.refresh.limit=60
tenantflow.rate-limit.rules.refresh.window=1m
tenantflow.rate-limit.rules.upload.limit=30
tenantflow.rate-limit.rules.upload.window=1m
tenantflow.rate-limit.rules.search.limit=120
tenantflow.rate-limit.rules.search.window=1m

# ==========================
# Actuator / metrics
# ==========================
# Operational endpoints live on a separate port that must NOT be published publicly
# (only the internal network / Prometheus can reach it).
management.server.port=${MANAGEMENT_PORT:8091}
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Status-only /livez and /readyz on the main port for load balancers - no details.
management.endpoint.health.probes.add-additional-paths=true
# Readiness depends on the database only: Redis outages degrade (fallbacks) but do not
# take the instance out of rotation.
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=false

# ==========================
# API documentation (OpenAPI at /v3/api-docs, Swagger UI at /swagger-ui.html)
# ==========================
# Off by default so no deployment publishes it by accident; set
# TENANTFLOW_API_DOCS_ENABLED=true for local development only.
springdoc.api-docs.enabled=${TENANTFLOW_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${TENANTFLOW_API_DOCS_ENABLED:false}
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=false

# ==========================
# Graceful shutdown
# ==========================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ==========================
# Attachments: where file bytes live (metadata is always in PostgreSQL)
# ==========================
# filesystem (default) = a local directory; works with no extra services and survives restarts.
# s3 = any S3-compatible store (MinIO in docker-compose, AWS S3 in production).
tenantflow.storage.type=${TENANTFLOW_STORAGE_TYPE:filesystem}
tenantflow.storage.directory=${TENANTFLOW_STORAGE_DIR:${user.home}/.tenantflow/storage}
tenantflow.storage.bucket=${TENANTFLOW_STORAGE_BUCKET:tenantflow-attachments}
# Empty for AWS S3; e.g. http://localhost:9000 for MinIO.
tenantflow.storage.endpoint=${TENANTFLOW_STORAGE_ENDPOINT:http://localhost:9000}
tenantflow.storage.region=${TENANTFLOW_STORAGE_REGION:us-east-1}
# Leave empty on AWS to use the default credential chain (IAM role); never commit real keys.
tenantflow.storage.access-key=${TENANTFLOW_STORAGE_ACCESS_KEY:}
tenantflow.storage.secret-key=${TENANTFLOW_STORAGE_SECRET_KEY:}
tenantflow.storage.path-style=${TENANTFLOW_STORAGE_PATH_STYLE:true}
# Local development only: create the bucket on start-up if it does not exist.
tenantflow.storage.create-bucket=${TENANTFLOW_STORAGE_CREATE_BUCKET:false}
tenantflow.storage.max-file-size=${TENANTFLOW_STORAGE_MAX_FILE_SIZE:10MB}
# Only with a persistent disk mounted at TENANTFLOW_STORAGE_DIR (checked under the prod profile).
tenantflow.storage.filesystem-persistent=${TENANTFLOW_STORAGE_FILESYSTEM_PERSISTENT:false}
spring.servlet.multipart.max-file-size=${TENANTFLOW_STORAGE_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=11MB

# Due-date reminders and scheduled automations (idempotent; safe to run on several instances).
tenantflow.reminders.enabled=${TENANTFLOW_REMINDERS_ENABLED:true}
tenantflow.reminders.interval=${TENANTFLOW_REMINDERS_INTERVAL:PT15M}
