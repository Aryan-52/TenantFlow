spring.application.name=tenantflow-backend

# ==========================
# Database
# ==========================
spring.datasource.url=jdbc:postgresql://localhost:5432/tenantflow?options=-c%20TimeZone=Asia/Kolkata
spring.datasource.username=tenantflow
spring.datasource.password=tenantflow
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ==========================
# Server
# ==========================
server.port=8080

# ==========================
# JWT
# ==========================
tenantflow.jwt.secret=${TENANTFLOW_JWT_SECRET}
tenantflow.jwt.expiration-seconds=${TENANTFLOW_JWT_EXPIRATION_SECONDS:86400}

# ==========================
# CORS
# ==========================
# Comma-separated list of origins allowed to call the API from a browser.
tenantflow.cors.allowed-origins=${TENANTFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ==========================
# Refresh tokens ("Remember me")
# ==========================
tenantflow.refresh-token.expiration-days=${TENANTFLOW_REFRESH_TOKEN_EXPIRATION_DAYS:30}

# ==========================
# Password reset
# ==========================
tenantflow.password-reset.expiration-minutes=${TENANTFLOW_PASSWORD_RESET_EXPIRATION_MINUTES:30}
# {token} is substituted with the raw reset token. Must point at the frontend's
# /reset-password route.
tenantflow.password-reset.url-template=${TENANTFLOW_PASSWORD_RESET_URL:http://localhost:3000/reset-password?token={token}}

# ==========================
# Cookies (refresh-token cookie)
# ==========================
# MUST be true for any real (HTTPS) deployment. Only ever false for the bundled
# plain-HTTP local Docker Compose stack - see docker-compose.yml.
tenantflow.cookie.secure=${TENANTFLOW_COOKIE_SECURE:true}
tenantflow.cookie.same-site=${TENANTFLOW_COOKIE_SAME_SITE:Lax}

# ==========================
# Google OAuth (optional - leave both blank to disable "Continue with Google" entirely)
# ==========================
tenantflow.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
tenantflow.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
# Where the browser lands after a successful Google login; this frontend page then calls
# POST /api/auth/refresh to turn the cookie that was just set into an access token.
tenantflow.oauth.google.frontend-redirect-uri=${TENANTFLOW_OAUTH_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth-callback}

# Trust X-Forwarded-* headers from the nginx reverse proxy - needed so Spring Security
# builds correct absolute URLs (e.g. the OAuth2 redirect_uri) when running behind it.
server.forward-headers-strategy=native
