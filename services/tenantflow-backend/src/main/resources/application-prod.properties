# Production profile (SPRING_PROFILES_ACTIVE=prod). Only settings that differ from
# application.properties live here; secrets and endpoints always come from environment
# variables - see docs/OPERATIONS.md.

# Never publish the API documentation in production, whatever TENANTFLOW_API_DOCS_ENABLED says.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# No SQL in the logs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JSON (ECS) logs on stdout for the log shipper; MDC fields such as requestId are included.
logging.structured.format.console=ecs
logging.level.root=INFO

# Connection pool sized per instance: (instances x maximum-pool-size) must stay below
# PostgreSQL's max_connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000

# Errors never expose internals (also the defaults, made explicit).
server.error.include-stacktrace=never
server.error.include-message=never

# Production stores files in S3-compatible object storage unless explicitly overridden.
tenantflow.storage.type=${TENANTFLOW_STORAGE_TYPE:s3}
# Buckets are provisioned by infrastructure, never by the application.
tenantflow.storage.create-bucket=false
