# Local development profile: the backend run from source on this machine (scripts/dev-backend.ps1
# activates it). Only settings that differ from application.properties live here, and nothing in
# this file is secret. Every value can still be overridden with the matching environment variable.
#
#   Frontend (Vite)  http://localhost:5173
#   Backend (here)   http://localhost:8095   management 8091
#   PostgreSQL       localhost:5432, database tenantflow (the default datasource)
#
# Secrets (TENANTFLOW_JWT_SECRET, optional GOOGLE_OAUTH_CLIENT_ID / _SECRET) come from the
# environment or from the git-ignored .env file at the repository root - the same file Docker
# Compose reads. The path is relative to services/tenantflow-backend, where the backend runs.
# Real environment variables take precedence over the file.
spring.config.import=optional:file:../../.env[.properties]

# Plain HTTP on localhost: a Secure cookie would never be sent back by the browser.
tenantflow.cookie.secure=${TENANTFLOW_COOKIE_SECURE:false}

# The Vite dev server is the frontend here (Docker's nginx on 3000 is a separate setup).
tenantflow.oauth.google.frontend-redirect-uri=${TENANTFLOW_OAUTH_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth-callback}
tenantflow.password-reset.url-template=${TENANTFLOW_PASSWORD_RESET_URL:http://localhost:5173/reset-password?token={token}}

# No Redis needed for local development: in-process cache and rate-limit counters.
spring.cache.type=${TENANTFLOW_CACHE_TYPE:simple}
tenantflow.rate-limit.store=${TENANTFLOW_RATE_LIMIT_STORE:memory}

# API documentation at http://localhost:8095/swagger-ui.html (never under the prod profile).
springdoc.api-docs.enabled=${TENANTFLOW_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${TENANTFLOW_API_DOCS_ENABLED:true}
